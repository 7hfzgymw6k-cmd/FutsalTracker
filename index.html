<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00332e" />
  <meta name="copyright" content="Copyright © 2026 Suunnittelu ja laskenta Oy Saga. All rights reserved." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Futsal Tracker" />
  <title>Futsal Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="license" href="LICENSE.txt" />

<body>
  <div id="app">
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="back-btn" class="nav-btn hidden" aria-label="Done">Done</button>
      </div>
      <h1 id="nav-title" class="nav-title">Futsal Tracker</h1>
      <div class="top-bar-right">
        <button id="legal-btn" class="nav-btn icon-btn" aria-label="Legal">ⓘ</button>
      </div>
    </header>

    <main id="view-container" class="view-container"></main>
  </div>

  <!-- Confirmation / Info Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-message" class="modal-message"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
